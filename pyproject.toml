[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nora_retrieval"]

[project]
name = "nora_retrieval"
version = "0.0.1"
description = "Auditable, purpose-aware retrieval and Context Compiler for heterogeneous evidence and authority corpora."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0",
  "pytest>=8",
  "ruff>=0.6",
  "jsonschema>=4.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
